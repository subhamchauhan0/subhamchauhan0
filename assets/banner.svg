<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-label="Subham Chauhan — Systems, Networking and AI">
  <defs>
    <!-- Void Black & Charcoal Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0B" />
      <stop offset="60%" stop-color="#111113" />
      <stop offset="100%" stop-color="#170909" />
    </linearGradient>

    <!-- Crimson Eclipse Glow -->
    <radialGradient id="eclipseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B91C1C" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#8B0000" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0" />
    </radialGradient>

    <!-- Eclipse Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>

    <!-- Dragonslayer Edge Highlight -->
    <linearGradient id="bladeEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8DECC" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#A0A0A0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0.7" />
    </linearGradient>

    <!-- Typing Animation Clip Path -->
    <clipPath id="typingClip">
      <rect x="85" y="218" width="0" height="34">
        <animate attributeName="width" from="0" to="390" dur="3.2s" begin="0.4s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @keyframes eclipsePulse {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatUp {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.85; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-90px); opacity: 0; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes barGlow {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eclipse-aura {
      transform-box: fill-box;
      transform-origin: center;
      animation: eclipsePulse 5s ease-in-out infinite;
    }
    .rune-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: slowSpin 45s linear infinite;
    }
    .ember-1 { animation: floatUp 4.2s ease-in infinite; }
    .ember-2 { animation: floatUp 5.6s ease-in 1.1s infinite; }
    .ember-3 { animation: floatUp 3.8s ease-in 2.3s infinite; }
    .ember-4 { animation: floatUp 6.0s ease-in 0.6s infinite; }
    .ember-5 { animation: floatUp 4.8s ease-in 1.8s infinite; }
    .accent-bar { animation: barGlow 3s ease-in-out infinite; }
    .title-group { animation: fadeSlideIn 0.9s ease-out forwards; }

    .kicker {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #A0A0A0;
    }
    .name-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 50px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #E8DECC;
    }
    .subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2.5px;
      fill: #D6C6A5;
    }
    .motto {
      font-family: 'JetBrains Mono', 'Fira Code', 'Liberation Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #EF4444;
    }
    .pill-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #D1D5DB;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="340" rx="10" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="1198" height="338" rx="9" fill="none" stroke="#30363D" stroke-width="1.5" />

  <!-- Subtle Grid / Manga Hatch Lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="85" x2="1200" y2="85" />
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="255" x2="1200" y2="255" />
    <line x1="780" y1="0" x2="780" y2="340" />
  </g>

  <!-- Crimson Corner Brackets -->
  <path d="M 1 20 L 1 1 L 20 1" fill="none" stroke="#8B0000" stroke-width="2.5" />
  <path d="M 1180 1 L 1199 1 L 1199 20" fill="none" stroke="#8B0000" stroke-width="2.5" />
  <path d="M 1 320 L 1 339 L 20 339" fill="none" stroke="#8B0000" stroke-width="2.5" />
  <path d="M 1180 339 L 1199 339 L 1199 320" fill="none" stroke="#8B0000" stroke-width="2.5" />

  <!-- Right Side: Animated Crimson Eclipse -->
  <g transform="translate(975, 165)">
    <circle cx="0" cy="0" r="155" fill="url(#eclipseGlow)" class="eclipse-aura" />
    <circle cx="0" cy="0" r="112" fill="none" stroke="#8B0000" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="6 10" class="rune-ring" />
    <circle cx="0" cy="0" r="96" fill="url(#ringGrad)" />
    <circle cx="5" cy="3" r="89" fill="#0B0B0B" />
  </g>

  <!-- Right Side: Swordsman & Dragonslayer Silhouette -->
  <g>
    <!-- Colossal Sword Blade -->
    <polygon points="1115,12 1136,22 1008,339 922,339 1088,10" fill="#141416" />
    <line x1="1088" y1="10" x2="922" y2="339" stroke="url(#bladeEdge)" stroke-width="2" />
    <line x1="1115" y1="12" x2="1008" y2="339" stroke="#8B0000" stroke-opacity="0.55" stroke-width="1.5" />
    <line x1="1110" y1="16" x2="965" y2="339" stroke="#262629" stroke-width="2.5" />

    <!-- Tattered Cloak -->
    <polygon points="945,215 900,228 855,258 805,288 765,339 965,339 1020,339 1010,270 970,225" fill="#0D0D0F" />

    <!-- Armored Figure -->
    <polygon points="932,190 905,225 902,290 915,339 1065,339 1055,270 1022,200 995,180 982,155 987,125 964,120 942,135 928,165" fill="#08080A" />
    <!-- Crimson Visor Glint -->
    <line x1="985" y1="132" x2="977" y2="148" stroke="#DC2626" stroke-width="2" stroke-linecap="round" />
    <!-- Pauldron Rim -->
    <path d="M 932 190 Q 955 198 975 195" fill="none" stroke="#52525B" stroke-width="1.5" />
  </g>

  <!-- Floating Crimson Embers -->
  <g fill="#EF4444">
    <circle cx="880" cy="310" r="2" class="ember-1" />
    <circle cx="940" cy="325" r="1.5" class="ember-2" />
    <circle cx="1050" cy="300" r="2.2" class="ember-3" />
    <circle cx="820" cy="330" r="1.5" class="ember-4" />
    <circle cx="1095" cy="290" r="1.8" class="ember-5" />
  </g>

  <!-- Left Side: Editorial Name Card & Animations -->
  <g class="title-group">
    <!-- Left Vertical Crimson Bar -->
    <rect x="60" y="62" width="4" height="216" rx="2" fill="#8B0000" class="accent-bar" />
    <rect x="60" y="120" width="4" height="100" rx="2" fill="#DC2626" class="accent-bar" />

    <!-- Kicker -->
    <text x="85" y="76" class="kicker">SYSTEMS ARCHITECTURE  •  CYBERSECURITY  •  AI</text>

    <!-- Main Name -->
    <text x="87" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" letter-spacing="3" fill="#000000" opacity="0.7">SUBHAM CHAUHAN</text>
    <text x="85" y="136" class="name-title">SUBHAM CHAUHAN</text>

    <!-- Subtitle -->
    <text x="85" y="172" class="subtitle">SYSTEMS &amp; BACKEND DEVELOPER  |  C++17 · GO · PYTHON</text>

    <!-- Steel & Crimson Divider -->
    <line x1="85" y1="196" x2="580" y2="196" stroke="#30363D" stroke-width="1" />
    <line x1="85" y1="196" x2="220" y2="196" stroke="#8B0000" stroke-width="2" />
    <polygon points="220,192 225,196 220,200 215,196" fill="#DC2626" />

    <!-- Animated Typing Motto -->
    <g clip-path="url(#typingClip)">
      <text x="85" y="238" class="motto">&gt; STRUGGLE. ENDURE. OVERCOME._</text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(85, 268)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="#161618" stroke="#30363D" stroke-width="1" />
      <circle cx="12" cy="12" r="2.5" fill="#8B0000" />
      <text x="21" y="16" class="pill-text">C++17</text>

      <rect x="80" y="0" width="52" height="24" rx="4" fill="#161618" stroke="#30363D" stroke-width="1" />
      <circle cx="92" cy="12" r="2.5" fill="#8B0000" />
      <text x="101" y="16" class="pill-text">GO</text>

      <rect x="142" y="0" width="112" height="24" rx="4" fill="#161618" stroke="#30363D" stroke-width="1" />
      <circle cx="154" cy="12" r="2.5" fill="#8B0000" />
      <text x="163" y="16" class="pill-text">RAW SOCKETS</text>

      <rect x="264" y="0" width="96" height="24" rx="4" fill="#161618" stroke="#30363D" stroke-width="1" />
      <circle cx="276" cy="12" r="2.5" fill="#8B0000" />
      <text x="285" y="16" class="pill-text">RAG &amp; MCP</text>
    </g>
  </g>
</svg>

